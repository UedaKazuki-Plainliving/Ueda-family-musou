name: Smoke Test

on:
  push:
    paths: ['musou.html', 'three-bundle.js', 'test/**', 'package.json', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm test
